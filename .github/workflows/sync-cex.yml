name: Sync CEX

# CEX used-price refresh (PHONES + TABLETS + LAPTOPS + HEADPHONES) via the Apify route.
# Laptops added in Step-5 Pass-2 (screen-size guard + Core-Ultra strip); the full
# laptop set is now covered including acer-swift-go-14 (FIX C 'sfg' Swift-Go guard
# live). All other categories remain excluded.
# Scoped by explicit ?slugs= lists in <=12-product chunks so every HTTP request
# stays comfortably under Cloudflare's ~100s origin limit (proven Session-15
# pattern). Foldables (z-flip/z-fold/pro-fold) are now INCLUDED — the Step-5
# Pass-1 matcher fixes (RAM+storage "+" strip, name-token concatenation split,
# phone-only device-class guard) match them correctly. Laptops + all other
# categories remain excluded (they need the separate screen-size-guard pass).
# New phone/tablet products must be added to the slug lists below for coverage.
#
# Non-critical coverage: every chunk soft-warns on failure and the job stays
# green (never hard-fails). Schedule is offset from the eBay 00/06/12/18 cron.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync-cex:
    runs-on: ubuntu-latest
    steps:
      - name: CEX chunk 1 — phones A (soft — warn only)
        run: |
          SLUGS="google-pixel-8-pro-128gb,google-pixel-8a-128gb,google-pixel-9-128gb,google-pixel-9-pro-128gb,iphone-14-128gb,iphone-15-128gb,iphone-15-pro-128gb,iphone-16-128gb,iphone-16-pro-128gb,iphone-16-pro-max-256gb,iphone-se-3rd-gen-64gb,motorola-edge-50-pro-256gb"
          echo "Calling CEX sync (phones A)..."
          HTTP=$(curl -s -o /tmp/cex1.json -w "%{http_code}" --max-time 120 \
            "https://www.priceslicr.com/api/sync-cex-apify?secret=priceslicr-sync-2026&slugs=$SLUGS")
          BODY=$(cat /tmp/cex1.json 2>/dev/null)
          echo "HTTP status: $HTTP"
          echo "Response: $BODY"
          if [ "$HTTP" != "200" ] || ! echo "$BODY" | grep -q '"success":true'; then
            echo "::warning::CEX phones-A chunk failed (HTTP $HTTP) — non-critical, continuing"
          else
            echo "CEX phones-A OK"
          fi

      - name: CEX chunk 2 — phones B + foldables (soft — warn only)
        if: ${{ always() }}
        run: |
          SLUGS="nothing-phone-3a-128gb,oneplus-13-256gb,samsung-galaxy-a55-128gb,samsung-galaxy-s24-128gb,samsung-galaxy-s25-128gb,samsung-galaxy-s25-plus-256gb,google-pixel-9-pro-fold-256gb,samsung-galaxy-z-flip-4-128gb,samsung-galaxy-z-flip-5-256gb,samsung-galaxy-z-flip-6-256gb,samsung-galaxy-z-fold-5-256gb,samsung-galaxy-z-fold-6-256gb"
          echo "Calling CEX sync (phones B + foldables)..."
          HTTP=$(curl -s -o /tmp/cex2.json -w "%{http_code}" --max-time 120 \
            "https://www.priceslicr.com/api/sync-cex-apify?secret=priceslicr-sync-2026&slugs=$SLUGS")
          BODY=$(cat /tmp/cex2.json 2>/dev/null)
          echo "HTTP status: $HTTP"
          echo "Response: $BODY"
          if [ "$HTTP" != "200" ] || ! echo "$BODY" | grep -q '"success":true'; then
            echo "::warning::CEX phones-B+foldables chunk failed (HTTP $HTTP) — non-critical, continuing"
          else
            echo "CEX phones-B OK"
          fi

      - name: CEX chunk 3 — tablets (soft — warn only)
        if: ${{ always() }}
        run: |
          SLUGS="google-pixel-tablet-128gb,ipad-10th-gen-64gb-wifi,ipad-air-m2-11-inch-128gb-wifi,ipad-air-m2-13-inch-128gb-wifi,ipad-mini-7th-gen-128gb-wifi,ipad-pro-m4-11-inch-256gb-wifi,ipad-pro-m4-13-inch-256gb-wifi,lenovo-tab-p12-pro-256gb,samsung-galaxy-tab-s10-256gb,samsung-galaxy-tab-s10-fe-128gb,samsung-galaxy-tab-s10-plus-256gb"
          echo "Calling CEX sync (tablets)..."
          HTTP=$(curl -s -o /tmp/cex3.json -w "%{http_code}" --max-time 120 \
            "https://www.priceslicr.com/api/sync-cex-apify?secret=priceslicr-sync-2026&slugs=$SLUGS")
          BODY=$(cat /tmp/cex3.json 2>/dev/null)
          echo "HTTP status: $HTTP"
          echo "Response: $BODY"
          if [ "$HTTP" != "200" ] || ! echo "$BODY" | grep -q '"success":true'; then
            echo "::warning::CEX tablets chunk failed (HTTP $HTTP) — non-critical, continuing"
          else
            echo "CEX tablets OK"
          fi

      # Laptops (Step-5 Pass-2): screen-size guard (FIX A) + Core-Ultra CPU strip
      # (FIX B) match them safely. acer-swift-go-14 is now included via FIX C (it
      # requires the "sfg" Swift-Go model-code prefix, so a cheaper non-Go Swift 14
      # can't be written as its price). NO-STOCK laptops are kept so they auto-populate.
      - name: CEX chunk 4 — laptops A (soft — warn only)
        if: ${{ always() }}
        run: |
          SLUGS="asus-zenbook-14-oled,dell-xps-13-9340,dell-xps-15-9530,framework-laptop-13-amd,hp-envy-x360-15,hp-spectre-x360-14,huawei-matebook-x-pro,lenovo-ideapad-5-pro-16,lenovo-thinkpad-x1-carbon-gen-12,lg-gram-16,macbook-air-13-m2-8gb-256gb,macbook-air-13-m3-8gb-256gb"
          echo "Calling CEX sync (laptops A)..."
          HTTP=$(curl -s -o /tmp/cex4.json -w "%{http_code}" --max-time 120 \
            "https://www.priceslicr.com/api/sync-cex-apify?secret=priceslicr-sync-2026&slugs=$SLUGS")
          BODY=$(cat /tmp/cex4.json 2>/dev/null)
          echo "HTTP status: $HTTP"
          echo "Response: $BODY"
          if [ "$HTTP" != "200" ] || ! echo "$BODY" | grep -q '"success":true'; then
            echo "::warning::CEX laptops-A chunk failed (HTTP $HTTP) — non-critical, continuing"
          else
            echo "CEX laptops-A OK"
          fi

      - name: CEX chunk 5 — laptops B (soft — warn only)
        if: ${{ always() }}
        run: |
          SLUGS="macbook-air-13-m3-8gb-512gb,macbook-air-15-m3,macbook-pro-14-m3,microsoft-surface-laptop-6-13,microsoft-surface-pro-11,razer-blade-14,samsung-galaxy-book4-pro-14,acer-swift-go-14"
          echo "Calling CEX sync (laptops B)..."
          HTTP=$(curl -s -o /tmp/cex5.json -w "%{http_code}" --max-time 120 \
            "https://www.priceslicr.com/api/sync-cex-apify?secret=priceslicr-sync-2026&slugs=$SLUGS")
          BODY=$(cat /tmp/cex5.json 2>/dev/null)
          echo "HTTP status: $HTTP"
          echo "Response: $BODY"
          if [ "$HTTP" != "200" ] || ! echo "$BODY" | grep -q '"success":true'; then
            echo "::warning::CEX laptops-B chunk failed (HTTP $HTTP) — non-critical, continuing"
          else
            echo "CEX laptops-B OK"
          fi

      # Headphones (Session 17): FIX H1 accessory/case-only title exclusion + H2
      # compound-name space-insensitive match + the boxId accessory guard (committed
      # under the "FIX H3" label) — rejects SMPA-prefix / MSC-class accessory boxes
      # regardless of title. apple-airpods-pro-2nd-gen is now included: CEX returns
      # only SMPA…MSC… cases for it, which the boxId guard rejects (title-independent),
      # so it stays NO-STOCK until genuine earbuds appear — never a case price. The 2
      # other NO-STOCK (QC Earbuds II / QC Ultra Headphones) are kept too. 12 slugs (=limit).
      - name: CEX chunk 6 — headphones (soft — warn only)
        if: ${{ always() }}
        run: |
          SLUGS="apple-airpods-max-usbc,apple-airpods-pro-2nd-gen,bang-olufsen-beoplay-h95,bose-quietcomfort-45,bose-quietcomfort-earbuds-ii,bose-quietcomfort-ultra-headphones,jabra-evolve2-85,samsung-galaxy-buds3-pro,sennheiser-momentum-4-wireless,sonos-ace,sony-wh-1000xm4,sony-wh-1000xm5"
          echo "Calling CEX sync (headphones)..."
          HTTP=$(curl -s -o /tmp/cex6.json -w "%{http_code}" --max-time 120 \
            "https://www.priceslicr.com/api/sync-cex-apify?secret=priceslicr-sync-2026&slugs=$SLUGS")
          BODY=$(cat /tmp/cex6.json 2>/dev/null)
          echo "HTTP status: $HTTP"
          echo "Response: $BODY"
          if [ "$HTTP" != "200" ] || ! echo "$BODY" | grep -q '"success":true'; then
            echo "::warning::CEX headphones chunk failed (HTTP $HTTP) — non-critical, continuing"
          else
            echo "CEX headphones OK"
          fi

      # Smartwatches (Session 18): four coupled matcher fixes — Apple brand-omission
      # (CEX writes "Watch Series 10/SE/Ultra 2", not "Apple"), connectivity-"+" despec
      # (recovers Fitbit Sense 2), the watch size guard (specs.screen mm; pins Venu 3
      # vs "Venu 3S 41mm" + Apple sizes), and the SAWS/SACC accessory boxId guard that
      # rejects watch straps/bands/chargers title-independently (must ship with the
      # brand relaxation). apple-watch-series-10-44mm-gps is deliberately OMITTED — its
      # spec was wrong (Series 10 ships 42/46mm, not 44mm) and is now corrected to
      # 42mm — apple-watch-series-10-42mm-gps is included. 10 slugs (<=12).
      - name: CEX chunk 7 — smartwatches (soft — warn only)
        if: ${{ always() }}
        run: |
          SLUGS="apple-watch-se-2nd-gen-40mm,apple-watch-series-10-42mm-gps,apple-watch-series-10-46mm-gps,apple-watch-ultra-2,fitbit-sense-2,garmin-fenix-8-47mm,garmin-venu-3,google-pixel-watch-3-45mm,samsung-galaxy-watch-7-44mm,samsung-galaxy-watch-ultra-47mm"
          echo "Calling CEX sync (smartwatches)..."
          HTTP=$(curl -s -o /tmp/cex7.json -w "%{http_code}" --max-time 120 \
            "https://www.priceslicr.com/api/sync-cex-apify?secret=priceslicr-sync-2026&slugs=$SLUGS")
          BODY=$(cat /tmp/cex7.json 2>/dev/null)
          echo "HTTP status: $HTTP"
          echo "Response: $BODY"
          if [ "$HTTP" != "200" ] || ! echo "$BODY" | grep -q '"success":true'; then
            echo "::warning::CEX smartwatches chunk failed (HTTP $HTTP) — non-critical, continuing"
          else
            echo "CEX smartwatches OK"
          fi
