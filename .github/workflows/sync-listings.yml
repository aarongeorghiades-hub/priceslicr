name: Sync Listings

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger eBay sync (critical — hard fail)
        run: |
          echo "Calling eBay sync..."
          HTTP=$(curl -s -o /tmp/ebay.json -w "%{http_code}" --max-time 280 \
            "https://www.priceslicr.com/api/sync-listings?secret=priceslicr-sync-2026")
          BODY=$(cat /tmp/ebay.json 2>/dev/null)
          echo "HTTP status: $HTTP"
          echo "Response: $BODY"
          if [ "$HTTP" != "200" ] || ! echo "$BODY" | grep -q '"success":true'; then
            echo "::error::eBay sync failed (HTTP $HTTP)"
            exit 1
          fi
          echo "eBay sync OK"

      # CEX now runs in its own daily workflow (sync-cex.yml) via the Apify
      # route; the legacy /api/sync-cex route was retired. Step removed here.

      - name: Trigger Back Market sync (soft — warn only, known expired trial)
        if: ${{ always() }}
        run: |
          echo "Calling Back Market sync..."
          HTTP=$(curl -s -o /tmp/bm.json -w "%{http_code}" --max-time 300 \
            "https://www.priceslicr.com/api/sync-backmarket?secret=priceslicr-sync-2026")
          BODY=$(cat /tmp/bm.json 2>/dev/null)
          echo "HTTP status: $HTTP"
          echo "Response: $BODY"
          if [ "$HTTP" != "200" ] || ! echo "$BODY" | grep -q '"success":true'; then
            echo "::warning::Back Market sync failed (known: expired trial) — HTTP $HTTP"
          else
            echo "Back Market sync OK"
          fi
