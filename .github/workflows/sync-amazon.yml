name: Sync Amazon

# Amazon Creators API (catalog/searchItems) live-price refresh. Additive listings
# source only — never touches the shared resolver/matcher. Each request is bounded to
# a <=8-slug batch (via ?slugs=) so it finishes well under Cloudflare/Railway's ~100s
# origin limit; a full-category run (phones = 24) 502s mid-run, hence the batching
# (proven CEX ?slugs= pattern). Mirrors the CEX soft-warn pattern: every batch warns
# on failure and the job stays green — if Amazon is unavailable (eligibility/auth/
# network) the route no-ops cleanly and eBay/CEX listings render exactly as before.
# Daily run keeps Amazon prices <=24h fresh. Schedule offset from eBay (00/06/12/18)
# and CEX (03:00).
#
# ⚠️ FROZEN TO PHONES (S26). Non-phone categories (headphones, laptop, tablet,
# smartwatch, monitor) are DELIBERATELY OMITTED below: an audit found the matcher
# binding accessories/parts/wrong devices to non-phone products (e.g. a Sonos Ace
# headphone STAND at £41, a Razer Blade matched to an ASUS Vivobook, a Huawei LCD
# replacement part). Their priced Amazon rows were reverted. Phones use stronger
# numeric model+storage tokens and matched cleanly, so they stay live. DO NOT re-add
# the non-phone batches until the non-phone matcher precision guard ships and is
# verified — only phone slugs run here for now.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  SYNC: "https://www.priceslicr.com/api/sync-amazon?secret=priceslicr-sync-2026"

jobs:
  sync-amazon:
    runs-on: ubuntu-latest
    steps:
      - name: Phones A (soft — warn only)
        run: |
          SLUGS="google-pixel-8-pro-128gb,google-pixel-8a-128gb,google-pixel-9-128gb,google-pixel-9-pro-128gb,google-pixel-9-pro-fold-256gb,iphone-14-128gb,iphone-15-128gb,iphone-15-pro-128gb"
          HTTP=$(curl -s -o /tmp/a.json -w "%{http_code}" --max-time 90 "$SYNC&slugs=$SLUGS")
          echo "HTTP $HTTP"; cat /tmp/a.json 2>/dev/null; echo
          if [ "$HTTP" != "200" ] || ! grep -q '"success":true' /tmp/a.json; then echo "::warning::Amazon phones-A failed (HTTP $HTTP) — non-critical"; fi

      - name: Phones B (soft — warn only)
        if: ${{ always() }}
        run: |
          SLUGS="iphone-16-128gb,iphone-16-pro-128gb,iphone-16-pro-max-256gb,iphone-se-3rd-gen-64gb,motorola-edge-50-pro-256gb,nothing-phone-3a-128gb,oneplus-13-256gb,samsung-galaxy-a55-128gb"
          HTTP=$(curl -s -o /tmp/a.json -w "%{http_code}" --max-time 90 "$SYNC&slugs=$SLUGS")
          echo "HTTP $HTTP"; cat /tmp/a.json 2>/dev/null; echo
          if [ "$HTTP" != "200" ] || ! grep -q '"success":true' /tmp/a.json; then echo "::warning::Amazon phones-B failed (HTTP $HTTP) — non-critical"; fi

      - name: Phones C (soft — warn only)
        if: ${{ always() }}
        run: |
          SLUGS="samsung-galaxy-s24-128gb,samsung-galaxy-s25-128gb,samsung-galaxy-s25-plus-256gb,samsung-galaxy-z-flip-4-128gb,samsung-galaxy-z-flip-5-256gb,samsung-galaxy-z-flip-6-256gb,samsung-galaxy-z-fold-5-256gb,samsung-galaxy-z-fold-6-256gb"
          HTTP=$(curl -s -o /tmp/a.json -w "%{http_code}" --max-time 90 "$SYNC&slugs=$SLUGS")
          echo "HTTP $HTTP"; cat /tmp/a.json 2>/dev/null; echo
          if [ "$HTTP" != "200" ] || ! grep -q '"success":true' /tmp/a.json; then echo "::warning::Amazon phones-C failed (HTTP $HTTP) — non-critical"; fi

      # ── NON-PHONE BATCHES FROZEN (S26) — removed pending the matcher precision guard.
      # Previously: Laptops A/B/C, Tablets A/B, Headphones A/B, Smartwatches A/B,
      # Monitors A/B. Re-add here only after the non-phone guard ships and is verified.
