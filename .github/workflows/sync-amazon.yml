        run: |
          SLUGS="iphone-16-128gb,iphone-16-pro-128gb,iphone-16-pro-max-256gb,iphone-se-3rd-gen-64gb,motorola-edge-50-pro-256gb,nothing-phone-3a-128gb,oneplus-13-256gb,samsung-galaxy-a55-128gb"
